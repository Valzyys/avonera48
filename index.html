<!doctype html>
<html lang="en" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfaf8" />
    <meta name="description" content="Avonera48 is a fan-made JKT48 website: see who is live, browse theater schedules and lineups, catch up on recent streams, explore members and read the latest news." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Avonera48 — a JKT48 fan website</title>
    <script>
      (function () {
        var d = document.documentElement;
        d.classList.remove("no-js");
        var t = null;
        try { t = localStorage.getItem("avn.theme"); } catch (e) {}
        if (t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        if (t !== "dark") t = "light";
        d.dataset.theme = t;
        d.style.colorScheme = t;
      })();
    </script>
    <style>
      /* Boot splash: painted with the HTML, replaced the moment React renders,
         so there is never a blank page while the app downloads. */
      html { background: #fbfaf8; }
      html[data-theme="dark"] { background: #121110; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; background: inherit; }
      .boot__word { font: 900 clamp(2.2rem, 7vw, 5rem)/1 "Zen Kaku Gothic New", system-ui, sans-serif; letter-spacing: 0.04em; color: #1c1a19; }
      html[data-theme="dark"] .boot__word { color: #f3f0eb; }
      .boot__bar { display: flex; height: 6px; width: min(280px, 60vw); margin: 18px auto 0; border-radius: 6px; overflow: hidden; }
      .boot__bar i { flex: 1; animation: boot 1s ease-in-out infinite alternate; }
      .boot__bar i:nth-child(1) { background: #e5679c; }
      .boot__bar i:nth-child(2) { background: #4b8fe2; animation-delay: .15s; }
      .boot__bar i:nth-child(3) { background: #ef7a3c; animation-delay: .3s; }
      .boot__bar i:nth-child(4) { background: #3aa877; animation-delay: .45s; }
      @keyframes boot { from { opacity: .25; } to { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" aria-hidden="true"><div><div class="boot__word">AVONERA48</div><div class="boot__bar"><i></i><i></i><i></i><i></i></div></div></div></div>
    <noscript>
      <p style="padding:24px;font-family:system-ui;color:#f3f5f8;background:#08090d">Avonera48 needs JavaScript enabled.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
