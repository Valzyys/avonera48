<!doctype html>
<html lang="en" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfaf8" />
    <meta name="description" content="Avonera48 is a fan-made JKT48 website: see who is live, browse theater schedules and lineups, catch up on recent streams, explore members and read the latest news." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Avonera48 — a JKT48 fan website</title>
    <script>
      (function () {
        var d = document.documentElement;
        d.classList.remove("no-js");
        var t = null;
        try { t = localStorage.getItem("avn.theme"); } catch (e) {}
        if (t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        if (t !== "dark") t = "light";
        d.dataset.theme = t;
        d.style.colorScheme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding:24px;font-family:system-ui;color:#f3f5f8;background:#08090d">Avonera48 needs JavaScript enabled.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
