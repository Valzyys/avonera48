# Include inside the existing HTTPS server {} for the fixed-IP relay.
# Keep the relay's existing authentication/access restrictions in place.
# This complements the existing /api/public/partner/v1/ signed API route.
location ^~ /api/partner/ {
    # No trailing slash or URI: preserve /api/partner/... and its query string.
    proxy_pass https://jkt48connect.com;
    proxy_http_version 1.1;
    proxy_set_header Host jkt48connect.com;
    proxy_ssl_server_name on;
    proxy_ssl_name jkt48connect.com;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    proxy_set_header Connection "";
    proxy_set_header Accept $http_accept;
    proxy_set_header User-Agent $http_user_agent;
    proxy_set_header X-Play-Key $http_x_play_key;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Range $http_range;
    proxy_pass_header Set-Cookie;

    proxy_redirect off;
    proxy_intercept_errors off;
    proxy_cache off;
    proxy_buffering off;
    proxy_read_timeout 60s;

    # Distinguish an upstream 404 from the relay's own missing location.
    add_header X-Avonera-Upstream-Status $upstream_status always;
    # Playback URLs contain session credentials.
    access_log off;
}
